# Transformer Configuration for Stage 2 Finetuning
# Cloned from transformer.yaml with multi-step finetuning overrides.

seed_everything: 42

trainer:
  default_root_dir: ${oc.env:EXPERIMENT_ROOT,./experiments/full_comparison}/finetune_transformer
  precision: bf16-mixed
  devices: 1
  num_nodes: 1
  accelerator: gpu
  strategy: ddp
  gradient_clip_val: 0.5
  gradient_clip_algorithm: "norm"
  min_epochs: 1
  max_epochs: 20
  check_val_every_n_epoch: 2
  enable_progress_bar: false
  sync_batchnorm: True
  enable_checkpointing: True
  num_sanity_val_steps: 1
  fast_dev_run: false

  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ${oc.env:EXPERIMENT_ROOT,./experiments/full_comparison}/finetune_transformer
      name: finetune_transformer_logs

  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "step"

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: ${oc.env:EXPERIMENT_ROOT,./experiments/full_comparison}/finetune_transformer/checkpoints
        monitor: "val/w_mse_aggregate_168_hrs_ensemble_mean"
        mode: "min"
        save_top_k: 1
        save_last: True
        verbose: False
        filename: "best"
        auto_insert_metric_name: False

    - class_path: lightning.pytorch.callbacks.RichModelSummary
      init_args:
        max_depth: -1

model:
  weighted_loss: True
  lr: 5e-6
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_epochs: 2
  max_epochs: 20
  warmup_start_lr: 1e-8
  eta_min: 1e-8
  pretrained_path: null

  net:
    class_path: stormer.models.hub.stormer.Stormer
